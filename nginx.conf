events {}

http {
    server {
        listen 4289 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://iip_api_auth:4289;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4290 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://iip_api_core:4290;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4291 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://iip_api_ia_agent:4291;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4292;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
   		    proxy_pass http://iip_stats:3000;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }

}
