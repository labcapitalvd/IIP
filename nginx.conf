events {}

http {
    server {
        listen 4286 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/vd-cert.crt;
        ssl_certificate_key /etc/nginx/ssl/vd-cert.key;

	location / {
		proxy_pass http://iip_api_auth:4286;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }
    server {
        listen 4287 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/vd-cert.crt;
        ssl_certificate_key /etc/nginx/ssl/vd-cert.key;

	location / {
		proxy_pass http://iip_api_core:4287;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }
    server {
        listen 4288 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/vd-cert.crt;
        ssl_certificate_key /etc/nginx/ssl/vd-cert.key;

	location / {
		proxy_pass http://iip_api_files:4288;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }
    server {
        listen 4289 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/vd-cert.crt;
        ssl_certificate_key /etc/nginx/ssl/vd-cert.key;

	location / {
		proxy_pass http://iip_api_ia_agent:4289;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
    }
