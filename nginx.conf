events {}

http {
    server {
        listen 4293 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://api_auth:4293;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4294 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://api_core:4294;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4295 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
    		proxy_pass http://api_ia_agent:4295;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }
    server {
        listen 4292 ssl;
        #server_name hub.veeduriadistrital.gov.co;
        server_name localhost;

        ssl_certificate     /run/secrets/https_public;
        ssl_certificate_key /run/secrets/https_private;

    	location / {
   		    proxy_pass http://front_stats:3000;
    		proxy_set_header Host $host;
    		proxy_set_header X-Real-IP $remote_addr;
    		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    		proxy_set_header X-Forwarded-Proto $scheme;
    	}
    }

}
