[project]
name = "core-api"
version = "0.1.0"
description = "Contenedor encargado de publicar endpoints desde la base de datos"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120.2",
  "requests>=2.32.5",
  "uvicorn>=0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "application",
  "domain",
  "infrastructure",
  "routers",
  "schemas",
  "utils",
  "main.py",
]
