[project]
name = "iip-ia"
version = "0.1.0"
description = "Pyproject para dev de ia."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120.2",
    "shared_db",
    "shared_models",
    "shared_schemas",
    "shared_utils",
    "uvicorn>=0.38.0",
]

[tool.uv.sources]
shared_db = { workspace = true }
shared_models = { workspace = true }
shared_schemas = { workspace = true }
shared_utils = { workspace = true }

[tool.uv.workspace]
members = [
    "../IIP-Commons/packages/shared_db",
    "../IIP-Commons/packages/shared_models",
    "../IIP-Commons/packages/shared_schemas",
    "../IIP-Commons/packages/shared_utils"
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "ty>=0.0.1a22",
]
