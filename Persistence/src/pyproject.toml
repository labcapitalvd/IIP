[project]
name = "persistence"
version = "0.1.0"
description = "Pyproject para dev de auth."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.1",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["migrator", "schemer", "seeder", "populator", "scripts"]
