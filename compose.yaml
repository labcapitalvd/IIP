services:
  nginx:
    container_name: iip_nginx
    image: nginx:latest
    env_file: ./.env
    restart: unless-stopped
    secrets:
      - https_public
      - https_private
    networks:
      - iip_nginx
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
      - "${PORT_CORE}:${PORT_CORE}"
      - "${PORT_IA_AGENT}:${PORT_IA_AGENT}"
      # - "${PORT_STATS}:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    container_name: iip_db
    image: postgres:18-bookworm
    env_file: ./.env
    secrets:
      - postgres_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    networks:
      - iip_db_net
      - pgadmin_net
    volumes:
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  persister:
    container_name: iip_persister
    image: labcapital/apps:IIP-Persister
    env_file: ./.env
    secrets:
      - postgres_password
      - github_token
      - users_file
    networks:
      - iip_db_net

  stats:
    container_name: iip_stats
    image: labcapital/apps:IIP-Stats
    env_file: ./.env
    networks:
      - iip_nginx

  api_auth:
    container_name: iip_api_auth
    image: labcapital/apps:Auth
    env_file: ./.env
    secrets:
      - jwt_private_key
      - jwt_public_key
      - fernet_password
      - postgres_password
    networks:
      - iip_db_net
      - iip_nginx
    depends_on:
      db:
        condition: service_healthy

  api_core:
    container_name: iip_api_core
    image: labcapital/apps:IIP-Core
    env_file: ./.env
    secrets:
      - jwt_public_key
      - postgres_password
    networks:
      - iip_db_net
      - iip_nginx

  api_ia_agent:
    container_name: iip_api_ia_agent
    image: labcapital/apps:IIP-IA-Agent
    env_file: ./.env
    secrets:
      - jwt_public_key
      - postgres_password
    networks:
      - iip_db_net
      - iip_nginx

networks:
  iip_db_net:
    driver: bridge
    name: iip_db_network

  iip_nginx:
    driver: bridge
    name: iip_nginx_network

  pgadmin_net:
    name: pgadmin_network
    external: true

volumes:
  postgresql:
    name: stats_vol_pg

secrets:
  fernet_password:
    file: ../Secrets/fernet_password
  github_token:
    file: ../Secrets/github_token
  jwt_public_key:
    file: ../Secrets/jwt_public.pem
  jwt_private_key:
    file: ../Secrets/jwt_private.pem
  postgres_password:
    file: ../Secrets/postgres_password
  users_file:
    file: ../Secrets/users.toml
  https_public:
    file: ../Secrets/vd-cert.crt
  https_private:
    file: ../Secrets/vd-cert.key
  