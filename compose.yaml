services:
  nginx:
    container_name: app_nginx
    image: docker.io/nginx:latest
    env_file: ./.env
    restart: unless-stopped
    depends_on:
      - api_auth
      - api_core
    secrets:
      - https_public
      - https_private
    networks:
      - app_nginx
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
      - "${PORT_CORE}:${PORT_CORE}"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"

  db:
    container_name: app_db
    image: docker.io/postgres:18-bookworm
    env_file: ./.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    networks:
      - app_db_net
    volumes:
      - "postgresql:/var/lib/postgresql"
      - "./Persistence/src/backups:/backups"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-app_user} -d $${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    container_name: app_cache
    image: docker.io/valkey/valkey:8.0-alpine
    restart: unless-stopped
    # Expose port only if you need to inspect keys from your host machine
    ports:
      - "6379:6379"
    networks:
      - app_cache_net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  base:
    container_name: app_base
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/labcapital/apps:app-base
    env_file: ./.env

  persister:
    container_name: app_persister
    build:
      context: .
      dockerfile: Persistence/Dockerfile
    image: docker.io/labcapital/apps:app-persister
    depends_on:
      - api_core
    env_file: ./.env
    volumes:
      - "./Persistence/src/migrator/alembic/versions:/api/migrator/alembic/versions"
      - "./Persistence/src/scripts/extracted:/api/scripts/extracted"
      - "./Persistence/src/backups:/backups"
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
      - github_token_commons
      - github_token_iip
      - github_token_seeds
      - users_file
    networks:
      - app_db_net
      - app_nginx

  api_auth:
    container_name: app_api_auth
    build:
      context: .
      dockerfile: Auth/Dockerfile
    image: docker.io/labcapital/apps:app-auth
    depends_on:
      base:
        condition: service_started
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    env_file: ./.env
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
    networks:
      - app_db_net
      - app_nginx
      - app_cache_net

  api_core:
    container_name: app_api_core
    build:
      context: .
      dockerfile: Core/Dockerfile
    image: docker.io/labcapital/apps:app-core
    depends_on:
      - api_auth
    env_file: ./.env
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
    networks:
      - app_db_net
      - app_nginx
      - app_cache_net

networks:
  app_db_net:
    driver: bridge
    name: app_db_network

  app_nginx:
    driver: bridge
    name: app_nginx_network

  app_cache_net:
    driver: bridge
    name: app_cache_network

volumes:
  postgresql:
    name: stats_vol_pg

secrets:
  postgres_password:
    file: ./Secrets/postgres_password
  fernet_password:
    file: ./Secrets/fernet_password
  github_token_commons:
    file: ./Secrets/github_token_commons
  github_token_iip:
    file: ./Secrets/github_token_iip
  github_token_seeds:
    file: ./Secrets/github_token_seeds
  jwt_public_key:
    file: ./Secrets/jwt_public.pem
  jwt_private_key:
    file: ./Secrets/jwt_private.pem
  users_file:
    file: ./Secrets/users.toml
  https_public:
    file: ./Secrets/cert.crt
  https_private:
    file: ./Secrets/cert.key
