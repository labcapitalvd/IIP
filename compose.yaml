services:
  nginx:
    container_name: iip_nginx
    image: nginx:latest
    env_file: ./.env
    restart: unless-stopped
    secrets:
      - https_public
      - https_private
    networks:
      - iip_nginx
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
      - "${PORT_CORE}:${PORT_CORE}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    container_name: iip_db
    image: postgres:18-bookworm
    env_file: ./.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - iip_db_net
      - pgadmin_net
    volumes:
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  base:
    container_name: iip_base
    build:
      context: .
      dockerfile: Dockerfile
    image: labcapital/apps:IIP-Base

  persister:
    container_name: iip_persister
    build:
      context: .
      dockerfile: Persistence/Dockerfile
    image: labcapital/apps:IIP-Persister
    depends_on:
      base:
        condition: service_started
      db:
        condition: service_healthy
    env_file: ./.env
    volumes:
      - "./Persistence/src/migrator/alembic/versions:/api/migrator/alembic/versions"
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
      - github_token_commons
      - github_token_iip
      - github_token_seeds
      - users_file
    networks:
      - iip_db_net

  api_auth:
    container_name: iip_api_auth
    build:
      context: .
      dockerfile: Auth/Dockerfile
    image: labcapital/apps:IIP-Auth
    depends_on:
      base:
        condition: service_started
      db:
        condition: service_healthy
    env_file: ./.env
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
    networks:
      - iip_db_net
      - iip_nginx

  api_core:
    container_name: iip_api_core
    build:
      context: .
      dockerfile: Core/Dockerfile
    image: labcapital/apps:IIP-Core
    depends_on:
      base:
        condition: service_started
      db:
        condition: service_healthy
    env_file: ./.env
    secrets:
      - jwt_private_key
      - jwt_public_key
      - postgres_password
      - fernet_password
    networks:
      - iip_db_net
      - iip_nginx

networks:
  iip_db_net:
    driver: bridge
    name: iip_db_network

  iip_nginx:
    driver: bridge
    name: iip_nginx_network

  pgadmin_net:
    name: pgadmin_network
    external: true

volumes:
  postgresql:
    name: stats_vol_pg

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  fernet_password:
    environment: FERNET_PASSWORD
  github_token_commons:
    environment: GITHUB_TOKEN_COMMONS
  github_token_iip:
    environment: GITHUB_TOKEN_IIP
  github_token_seeds:
    environment: GITHUB_TOKEN_SEEDS
  jwt_public_key:
    file: ./Secrets/jwt_public.pem
  jwt_private_key:
    file: ./Secrets/jwt_private.pem
  users_file:
    file: ./Secrets/users.toml
  https_public:
    file: ./Secrets/cert.crt
  https_private:
    file: ./Secrets/cert.key
